name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Read-only token: CI never writes to the repo.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `ci` is the required status check for branch protection on develop and main.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image: Chromium and its Linux packages preinstalled, so CI makes no apt calls and
    # downloads no browser (ADR-007). Tag and digest must match @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    steps:
      # Third-party actions are pinned to full commit SHAs (release tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      # The browsers in the image only work with the same Playwright version as the lockfile.
      - name: Check Playwright matches the container image
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          test "$installed" = "1.64.1" || { echo "::error::@playwright/test is $installed but the CI image is v1.64.1; bump both (ADR-007)"; exit 1; }

      # Typecheck, unit tests and build. No secrets: every test mocks fetch.
      - run: npm run check

      # Starts its own dev server; the API is mocked and Turnstile uses the always-pass test key.
      - run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
